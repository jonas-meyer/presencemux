PACKAGE_NAME="presencemux-uvc"
PACKAGE_VERSION="#MODULE_VERSION#"
BUILT_MODULE_NAME[0]="usb_f_uvc"
DEST_MODULE_LOCATION[0]="/updates/dkms"
PATCH[0]="0001-usb-gadget-uvc-treat-ENODATA-as-a-missed-isochronous-transfer.patch"
# The files are from this kernel only. On another kernel, dkms skips the
# build, and the stock usb_f_uvc loads.
BUILD_EXCLUSIVE_KERNEL="^6\.18\.50\+rpt-rpi-2712$"
AUTOINSTALL="yes"
