PACKAGE_NAME="presencemux-ffs"
PACKAGE_VERSION="#MODULE_VERSION#"
BUILT_MODULE_NAME[0]="usb_f_fs"
DEST_MODULE_LOCATION[0]="/updates/dkms"
PATCH[0]="0001-usb-gadget-f_fs-accept-video-class-specific-descriptors.patch"
# The files are from this kernel only. On another kernel, dkms skips the
# build, and the stock usb_f_fs loads. It rejects the UVC descriptors, and the
# gadget does not bind.
BUILD_EXCLUSIVE_KERNEL="^6\.18\.50\+rpt-rpi-2712$"
AUTOINSTALL="yes"
