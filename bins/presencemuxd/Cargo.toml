[package]
name = "presencemuxd"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Policy daemon of the PresenceMux appliance"

[package.metadata.deb]
maintainer = "Jonas Meyer-Ohle <19151471+jonas-meyer@users.noreply.github.com>"
copyright = "2026, Jonas Meyer-Ohle"
license-file = ["../../LICENSE", "0"]
extended-description = """\
presencemuxd owns the privacy state of the PresenceMux appliance. This state \
includes the cam and mic planes, the presets, and the leases that the media \
layer enforces. The daemon serves its Varlink interface on the socket \
/run/presencemux/io.presencemux.Controller. Members of the presencemux group \
can use this socket, for example with presencemuxctl, the command-line client \
in this package."""
section = "video"
depends = "$auto, systemd (>= 257)"
maintainer-scripts = "debian/"
assets = [
    ["target/release/presencemuxd", "usr/bin/", "755"],
    ["target/release/presencemuxctl", "usr/bin/", "755"],
    ["debian/config.toml", "etc/presencemux/config.toml", "644"],
]
systemd-units = { enable = true, start = true }

[dependencies]
listenfd.workspace = true
presencemux-api.workspace = true
presencemux-core.workspace = true
rustix = { workspace = true, features = ["time"] }
sd-notify.workspace = true
serde.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt", "signal", "sync", "time"] }
tokio-stream = { workspace = true, features = ["sync"] }
toml.workspace = true
tracing.workspace = true
tracing-journald.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
zlink = { workspace = true, features = ["service"] }

[dev-dependencies]
expect-test.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
zlink = { workspace = true, features = ["idl-parse", "proxy"] }

[lints]
workspace = true
