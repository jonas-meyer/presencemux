# /etc/presencemux/config.toml

[slates.still-here]
file = "/usr/share/presencemux-cam/slates/still-here.jpg"

[slates.brb]
file = "/usr/share/presencemux-cam/slates/brb.jpg"

[slates.away]
file = "/usr/share/presencemux-cam/slates/away.jpg"

[presets.live]
cam = "live"
mic = "unmuted"

[presets.still-here]
cam = { slate = "still-here" }
mic = "unmuted"

[presets.brb]
cam = { slate = "brb" }
mic = "muted"

[presets.away]
cam = { slate = "away" }
mic = "muted"
