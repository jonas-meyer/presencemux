# Keeps CPU 3 free for the interrupt of the UDC. presencemux-gadget moves the
# interrupt there (interrupt::CPU), and a test checks that this file leaves it
# out. The dwc2 UDC starts each isochronous transfer from its interrupt, and
# an interrupt later than one microframe (125 µs) cuts a video frame. The
# package installs this file for system.slice and user.slice. Kernel threads
# are not in a slice and can still run on CPU 3.
[Slice]
AllowedCPUs=0-2
