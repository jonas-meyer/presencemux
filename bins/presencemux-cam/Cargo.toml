[package]
name = "presencemux-cam"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Cam worker of the PresenceMux appliance"

[package.metadata.deb]
maintainer = "Jonas Meyer-Ohle <19151471+jonas-meyer@users.noreply.github.com>"
copyright = "2026, Jonas Meyer-Ohle"
license-file = ["../../LICENSE", "0"]
extended-description = """\
presencemux-cam is the cam worker of the PresenceMux appliance. It answers \
the requests of the host on the UVC gadget node. It sends frames to the host: \
live video, a slate or blank. The worker keeps the gadget node in the systemd \
fd store. The host then stays connected when the worker restarts."""
section = "video"
depends = "$auto, systemd (>= 257), presencemux-gadget"
maintainer-scripts = "debian/"
assets = [["target/release/presencemux-cam", "usr/bin/", "755"]]
systemd-units = { enable = true, start = true }

[dependencies]
rustix = { workspace = true, features = ["fs", "mm", "time"] }
sd-notify = { workspace = true, features = ["fdstore"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt", "signal", "time"] }
tracing.workspace = true
tracing-journald.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
zerocopy.workspace = true

[dev-dependencies]
insta.workspace = true
proptest.workspace = true

[lints]
workspace = true
