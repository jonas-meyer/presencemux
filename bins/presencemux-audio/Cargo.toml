[package]
name = "presencemux-audio"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Audio stack of the PresenceMux appliance"

[package.metadata.deb]
maintainer = "Jonas Meyer-Ohle <19151471+jonas-meyer@users.noreply.github.com>"
copyright = "2026, Jonas Meyer-Ohle"
license-file = ["../../LICENSE", "0"]
extended-description = """\
presencemux-audio runs PipeWire and WirePlumber as system services for the \
PresenceMux appliance. It routes the speakers Studio Audio of the USB gadget \
to the USB audio interface, and masks the user instances of PipeWire and \
WirePlumber."""
section = "sound"
depends = "pipewire (>= 1.4), wireplumber (>= 0.5), systemd (>= 257)"
maintainer-scripts = "debian/"
assets = [
    ["config/pipewire.conf.d/50-presencemux.conf", "etc/pipewire/pipewire.conf.d/", "644"],
    ["config/wireplumber.conf.d/50-presencemux.conf", "etc/wireplumber/wireplumber.conf.d/", "644"],
]
systemd-units = [
    { unit-name = "presencemux-pipewire", enable = true, start = true },
    { unit-name = "presencemux-wireplumber", enable = true, start = true },
]

[lints]
workspace = true
