# The audio devices of PresenceMux. Each UAC2 function drives its route, and
# the USB audio interface follows with the resampler.

# The monitors that WirePlumber does not run.
wireplumber.profiles = {
    main-embedded = {
        monitor.v4l2       = disabled
        monitor.libcamera  = disabled
        monitor.bluez      = disabled
        monitor.bluez-midi = disabled
        monitor.alsa-midi  = disabled
    }
}

# The software volume of a new sink, 100 %.
wireplumber.settings = {
    device.routes.default-sink-volume = 1.0
}

monitor.alsa.rules = [
    # The UAC2 function "Studio Microphone", a playback PCM on the Pi. It
    # drives the mic route.
    {   matches = [ { alsa.card_name = "UAC2_Gadget", media.class = "Audio/Sink" } ]
        actions = { update-props = {
            node.name        = "presencemux.gadget.mic"
            node.description = "Studio Microphone (gadget)"
            priority.driver  = 3000
        } }
    }
    # The UAC2 function "Studio Audio", a capture PCM on the Pi. It drives the
    # speaker route.
    {   matches = [ { alsa.card_name = "UAC2_Gadget", media.class = "Audio/Source" } ]
        actions = { update-props = {
            node.name        = "presencemux.gadget.speakers"
            node.description = "Studio Audio (gadget)"
            priority.driver  = 3000
        } }
    }
    # The USB audio interface.
    {   matches = [ { alsa.driver_name = "snd_usb_audio", media.class = "Audio/Sink" } ]
        actions = { update-props = { node.name = "presencemux.interface.out" } }
    }
    {   matches = [ { alsa.driver_name = "snd_usb_audio", media.class = "Audio/Source" } ]
        actions = { update-props = { node.name = "presencemux.interface.in" } }
    }
    # The HDMI outputs, and the sound card of a USB camera.
    {   matches = [
            { device.name = "~alsa_card\\.platform-.*\\.hdmi" }
            { device.form-factor = "webcam" }
        ]
        actions = { update-props = { device.disabled = true } }
    }
]
