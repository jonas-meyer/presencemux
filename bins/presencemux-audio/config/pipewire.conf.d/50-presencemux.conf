# The audio graph of PresenceMux.

context.properties = {
    support.dbus              = false
    default.clock.quantum     = 256
    default.clock.min-quantum = 128
    default.clock.max-quantum = 1024
}

context.objects = [
    # The default sink. A stream on the Pi without a target plays here, and
    # not to "Studio Microphone".
    {   factory = adapter
        args = {
            factory.name     = support.null-audio-sink
            node.name        = "presencemux.discard"
            node.description = "PresenceMux discard"
            media.class      = "Audio/Sink"
            audio.position   = [ FL FR ]
            priority.session = 100000
        }
    }
]

context.modules = [
    # The speaker route, from "Studio Audio" to the audio interface. It waits
    # while one of the two nodes is missing.
    {   name = libpipewire-module-loopback
        args = {
            node.description = "PresenceMux speakers"
            audio.position   = [ FL FR ]
            capture.props = {
                node.name          = "presencemux.speakers.in"
                target.object      = "presencemux.gadget.speakers"
                node.dont-fallback = true
                node.linger        = true
            }
            playback.props = {
                node.name          = "presencemux.speakers.out"
                target.object      = "presencemux.interface.out"
                node.dont-fallback = true
                node.linger        = true
            }
        }
    }
]
