[workspace]
resolver = "3"
members = ["crates/*", "bins/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
presencemux-api = { path = "crates/presencemux-api" }
presencemux-core = { path = "crates/presencemux-core" }
presencemux-jpeg = { path = "crates/presencemux-jpeg" }
presencemux-lease = { path = "crates/presencemux-lease" }
ab_glyph = "0.2"
clap = { version = "4.6", features = ["derive"] }
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
expect-test = "1.5"
futures-core = "0.3"
insta = "1.49"
jpeg-encoder = "0.7"
listenfd = "1.0"
memchr = "2.8"
pipewire = "0.10"
proptest = "1.11"
rustix = "1.1"
sd-notify = "0.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.27"
thiserror = "2.0"
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"] }
tokio = "1.53"
tokio-stream = "0.1"
toml = "1.1"
tracing = "0.1"
tracing-journald = "0.3"
tracing-subscriber = "0.3"
udev = "0.9"
zerocopy = { version = "0.8", features = ["derive"] }
zlink = { version = "0.7", default-features = false, features = ["tokio", "tracing"] }

[workspace.lints.rust]
unsafe_code = "deny"
unreachable_pub = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Too noisy for this workspace.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
similar_names = "allow"
too_many_lines = "allow"
# Rules of this project.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
print_stderr = "warn"
print_stdout = "warn"
undocumented_unsafe_blocks = "warn"
use_self = "warn"
